name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to test"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - review
          - production
      review-number:
        description: "Review number (required for review environment)"
        required: false
        type: string
      tags:
        description: "Test tags"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression
          - all

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test --grep "${{ inputs.tags == 'all'  && '.*' || inputs.tags || github.event_name == 'schedule' && 'regression' || 'smoke'}}"
        env:
          ENV: ${{ inputs.environment }}
          REVIEW_NUMBER: ${{ inputs.review-number }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
