name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to test"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - review
      review-number:
        description: "Review number (required for review environment)"
        required: false
        type: string
      tags:
        description: "Test tags"
        required: true
        default: "all"
        type: choice
        options:
          - smoke
          - regression
          - all
      test-type:
        description: "Type of tests to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - regression
          - unit

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test --grep "${{ inputs.tags || '.*' }}" ${{ inputs.test-type != 'all' && format('--grep {0}', inputs.test-type) || '' }}
        env:
          ENV: ${{ inputs.environment }}
          REVIEW_NUMBER: ${{ inputs.review-number }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
